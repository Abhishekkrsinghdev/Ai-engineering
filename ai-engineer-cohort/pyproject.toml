[project]
name = "ai-engineer-cohort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishekkrsinghdev", email = "hrithiksinghrocks31@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=1.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.62.0",
]

[project.scripts]
ai-engineer-cohort = "ai_engineer_cohort:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
